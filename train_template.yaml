name: train
description: Fine-tune on gas volume data, optionally from a pre-trained backbone

inputs:
- {name: code_uri,              type: String, description: 'GCS URI of src.tar.gz'}
- {name: output_path,           type: String, description: 'GCS output path'}
- {name: pretrain_backbone_uri, type: String, description: 'GCS URI of pretrain_backbone.pt (empty to skip)'}

implementation:
  container:
    image: IMAGE
    command:
      - python3
      - entrypoint.py
      - --code_uri
      - {inputValue: code_uri}
      - --output_path
      - {inputValue: output_path}
      - --pretrain_backbone_uri
      - {inputValue: pretrain_backbone_uri}
