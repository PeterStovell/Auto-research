apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pretrain-finetune-
  annotations: {pipelines.kubeflow.org/kfp_sdk_version: 1.8.22, pipelines.kubeflow.org/pipeline_compilation_time: '2026-05-19T14:06:56.821859',
    pipelines.kubeflow.org/pipeline_spec: '{"description": "Pre-train on M5+Electricity,
      fine-tune on gas volume", "inputs": [{"name": "code_uri", "type": "String"},
      {"name": "pretrain_data_uri", "type": "String"}, {"name": "pretrain_output_path",
      "type": "String"}, {"name": "pretrain_backbone_uri", "type": "String"}, {"name":
      "output_path", "type": "String"}], "name": "pretrain-finetune"}'}
  labels: {pipelines.kubeflow.org/kfp_sdk_version: 1.8.22}
spec:
  entrypoint: pretrain-finetune
  templates:
  - name: pretrain
    container:
      args: []
      command: [python3, entrypoint.py, --mode, pretrain, --code_uri, '{{inputs.parameters.code_uri}}',
        --pretrain_data_uri, '{{inputs.parameters.pretrain_data_uri}}', --output_path,
        '{{inputs.parameters.pretrain_output_path}}']
      image: gcr.io/dev-stovell-ai/pytorch-research/auto-research@sha256:a1ef525b0fc68715a4c8502ae03829567c0e681e8bea28cdb4cba8183fa4d4a5
      resources:
        limits: {nvidia.com/gpu: 1, memory: 128G}
        requests: {memory: 16G}
    inputs:
      parameters:
      - {name: code_uri}
      - {name: pretrain_data_uri}
      - {name: pretrain_output_path}
    nodeSelector: {cloud.google.com/gke-accelerator: nvidia-tesla-t4}
    metadata:
      labels:
        pipelines.kubeflow.org/kfp_sdk_version: 1.8.22
        pipelines.kubeflow.org/pipeline-sdk-type: kfp
        pipelines.kubeflow.org/enable_caching: "true"
      annotations: {pipelines.kubeflow.org/component_spec: '{"description": "Pre-train
          backbone on M5 + UCI Electricity datasets", "implementation": {"container":
          {"command": ["python3", "entrypoint.py", "--mode", "pretrain", "--code_uri",
          {"inputValue": "code_uri"}, "--pretrain_data_uri", {"inputValue": "pretrain_data_uri"},
          "--output_path", {"inputValue": "output_path"}], "image": "gcr.io/dev-stovell-ai/pytorch-research/auto-research@sha256:a1ef525b0fc68715a4c8502ae03829567c0e681e8bea28cdb4cba8183fa4d4a5"}},
          "inputs": [{"description": "GCS URI of src.tar.gz", "name": "code_uri",
          "type": "String"}, {"description": "GCS folder with pretrain parquets",
          "name": "pretrain_data_uri", "type": "String"}, {"description": "GCS output
          path for backbone", "name": "output_path", "type": "String"}], "name": "pretrain"}',
        pipelines.kubeflow.org/component_ref: '{"digest": "5c00d058c1068714aa48f4000a632d9328eaba55425d057c3a53999bc55b4c94",
          "url": "pretrain.yaml"}', pipelines.kubeflow.org/arguments.parameters: '{"code_uri":
          "{{inputs.parameters.code_uri}}", "output_path": "{{inputs.parameters.pretrain_output_path}}",
          "pretrain_data_uri": "{{inputs.parameters.pretrain_data_uri}}"}'}
  - name: pretrain-finetune
    inputs:
      parameters:
      - {name: code_uri}
      - {name: output_path}
      - {name: pretrain_backbone_uri}
      - {name: pretrain_data_uri}
      - {name: pretrain_output_path}
    dag:
      tasks:
      - name: pretrain
        template: pretrain
        arguments:
          parameters:
          - {name: code_uri, value: '{{inputs.parameters.code_uri}}'}
          - {name: pretrain_data_uri, value: '{{inputs.parameters.pretrain_data_uri}}'}
          - {name: pretrain_output_path, value: '{{inputs.parameters.pretrain_output_path}}'}
      - name: train
        template: train
        dependencies: [pretrain]
        arguments:
          parameters:
          - {name: code_uri, value: '{{inputs.parameters.code_uri}}'}
          - {name: output_path, value: '{{inputs.parameters.output_path}}'}
          - {name: pretrain_backbone_uri, value: '{{inputs.parameters.pretrain_backbone_uri}}'}
  - name: train
    container:
      args: []
      command: [python3, entrypoint.py, --code_uri, '{{inputs.parameters.code_uri}}',
        --output_path, '{{inputs.parameters.output_path}}', --pretrain_backbone_uri,
        '{{inputs.parameters.pretrain_backbone_uri}}']
      image: gcr.io/dev-stovell-ai/pytorch-research/auto-research@sha256:a1ef525b0fc68715a4c8502ae03829567c0e681e8bea28cdb4cba8183fa4d4a5
      resources:
        limits: {nvidia.com/gpu: 1, memory: 128G}
        requests: {memory: 16G}
    inputs:
      parameters:
      - {name: code_uri}
      - {name: output_path}
      - {name: pretrain_backbone_uri}
    nodeSelector: {cloud.google.com/gke-accelerator: nvidia-tesla-t4}
    metadata:
      labels:
        pipelines.kubeflow.org/kfp_sdk_version: 1.8.22
        pipelines.kubeflow.org/pipeline-sdk-type: kfp
        pipelines.kubeflow.org/enable_caching: "true"
      annotations: {pipelines.kubeflow.org/component_spec: '{"description": "Fine-tune
          on gas volume data, optionally from a pre-trained backbone", "implementation":
          {"container": {"command": ["python3", "entrypoint.py", "--code_uri", {"inputValue":
          "code_uri"}, "--output_path", {"inputValue": "output_path"}, "--pretrain_backbone_uri",
          {"inputValue": "pretrain_backbone_uri"}], "image": "gcr.io/dev-stovell-ai/pytorch-research/auto-research@sha256:a1ef525b0fc68715a4c8502ae03829567c0e681e8bea28cdb4cba8183fa4d4a5"}},
          "inputs": [{"description": "GCS URI of src.tar.gz", "name": "code_uri",
          "type": "String"}, {"description": "GCS output path", "name": "output_path",
          "type": "String"}, {"description": "GCS URI of pretrain_backbone.pt (empty
          to skip)", "name": "pretrain_backbone_uri", "type": "String"}], "name":
          "train"}', pipelines.kubeflow.org/component_ref: '{"digest": "5fda50166f7c55c0cf2b90e833d4e6f209e63bcae1642b44539337d74005b4c2",
          "url": "train.yaml"}', pipelines.kubeflow.org/arguments.parameters: '{"code_uri":
          "{{inputs.parameters.code_uri}}", "output_path": "{{inputs.parameters.output_path}}",
          "pretrain_backbone_uri": "{{inputs.parameters.pretrain_backbone_uri}}"}'}
  arguments:
    parameters:
    - {name: code_uri}
    - {name: pretrain_data_uri}
    - {name: pretrain_output_path}
    - {name: pretrain_backbone_uri}
    - {name: output_path}
  serviceAccountName: pipeline-runner
