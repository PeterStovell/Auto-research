name: pretrain
description: Pre-train backbone on M5 + UCI Electricity datasets

inputs:
- {name: code_uri,          type: String, description: 'GCS URI of src.tar.gz'}
- {name: pretrain_data_uri, type: String, description: 'GCS folder with pretrain parquets'}
- {name: output_path,       type: String, description: 'GCS output path for backbone'}

implementation:
  container:
    image: IMAGE
    command:
      - python3
      - entrypoint.py
      - --mode
      - pretrain
      - --code_uri
      - {inputValue: code_uri}
      - --pretrain_data_uri
      - {inputValue: pretrain_data_uri}
      - --output_path
      - {inputValue: output_path}
